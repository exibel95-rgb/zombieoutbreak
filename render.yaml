# Free web service for the online relay (server/relay.py). Render > New > Blueprint > this repo.
services:
  - type: web
    name: zombieoutbreak-relay
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "true"
    startCommand: python3 -I server/relay.py
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:          # only redeploy when the server itself changes (not for website updates)
      paths:
        - server/**
